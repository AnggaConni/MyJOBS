name: Auto Update MyJOBS

concurrency:
  group: myjobs-scraper
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - "vacancy.json"
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Syntax Check
        run: python -m py_compile scraper.py

      - name: Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Run MyJOBS Scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          MAX_GOOGLE_QUERIES: 19
          APIFY_UNCAREERS_ACTOR: nomad-agent/un-careers-scraper
          APIFY_UNDP_ACTOR: maydit/oracle-recruiting-jobs-scraper
          STALE_DAYS: 7
        run: python scraper.py

      - name: Commit & Push Update JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vacancy.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto-update: refresh MyJOBS"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
