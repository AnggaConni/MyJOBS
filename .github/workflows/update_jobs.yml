name: Auto Update Kalimantan Barat Vacancies

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Syntax Check
        run: python -m py_compile scraper.py

      - name: Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Run Hybrid Scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MAX_GOOGLE_QUERIES: 6
        run: python scraper.py

      - name: Commit & Push Update JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vacancy.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto-update: refresh Kalimantan Barat jobs"
          git push
