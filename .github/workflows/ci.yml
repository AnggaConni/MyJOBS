name: MyJOBS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
    paths:
      - "scraper.py"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Syntax check
        run: python -m py_compile scraper.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
